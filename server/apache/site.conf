<VirtualHost *:80>
    ServerName localhost

    # Apache 2.4 doesn't auto-pass shell env vars to mod_wsgi workers; list
    # them explicitly so docker-compose's env_file values reach load_config().
    PassEnv TRANSITLAND_API_KEY TRANSITLAND_BASE_URL APP_API_KEYS
    PassEnv RATE_LIMIT_PER_HOUR ACCESS_LOG_PATH RATE_LIMIT_TAIL_BYTES
    PassEnv UPSTREAM_CONNECT_TIMEOUT UPSTREAM_READ_TIMEOUT
    PassEnv STATS_PATH_SECRET STATS_MAX_LOG_BYTES STATS_CACHE_SECONDS
    PassEnv CACHE_DB_PATH
    PassEnv FIVE_ELEVEN_API_KEY 511_API_KEY FIVE_ELEVEN_BASE_URL FIVE_ELEVEN_AGENCY
    PassEnv GTFS_511_DB_DIR FIVE_ELEVEN_RT_TTL FIVE_ELEVEN_STATIC_TTL FIVE_ELEVEN_ENABLED

    WSGIDaemonProcess ctn processes=1 threads=5 display-name=%{GROUP} python-path=/app
    WSGIProcessGroup ctn
    WSGIScriptAlias / /app/wsgi.py

    <Directory /app>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_with_time
    CustomLog ${APACHE_LOG_DIR}/access.log combined_with_time
    ErrorLog ${APACHE_LOG_DIR}/error.log
</VirtualHost>
