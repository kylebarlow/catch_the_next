<VirtualHost *:80>
    ServerName localhost

    WSGIDaemonProcess ctn processes=1 threads=5 display-name=%{GROUP} python-path=/app
    WSGIProcessGroup ctn
    WSGIScriptAlias / /app/wsgi.py

    <Directory /app>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_with_time
    CustomLog ${APACHE_LOG_DIR}/access.log combined_with_time
    ErrorLog ${APACHE_LOG_DIR}/error.log
</VirtualHost>
